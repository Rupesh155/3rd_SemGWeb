<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
           margin: 0;
           padding: 0; 
        }
        #nav{
            background-color: black;
            display: flex;
            height: 40px;
            justify-content: space-between;
            align-items: center;
        }
        a{
            color: snow;
            transition: 2s;
        }
        a:hover{
            color: orangered;
            transform: scale(1.9);
        }
        button{
            background-color: rgb(220, 148, 16);
            border: none;
            border-radius: 21px;
            width: 70px;
            height: 22px;
        }
        #nav_child{
            display: flex;
            justify-content: space-between;
            width: 300px;
            /* background-color: red; */
        }
        @media screen and (max-width:450px) {
            #nav{
           
                flex-direction: column;
                height: auto;
                gap: 10px;
            }
            #nav_child{
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            
        }
    </style>
</head>
<body>
    <div id="nav">
        <a>Home</a>
        <div id="nav_child">
            <a>About</a>
            <a>Contact Us</a>
            <a>About</a>
        </div>
        <button>Login</button>
    </div>
</body>
</html>
